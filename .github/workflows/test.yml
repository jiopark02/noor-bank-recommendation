name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test --if-present

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: "npm audit (full tree) - supply chain visibility"
        continue-on-error: true
        run: npm audit
      - name: "npm audit (production tree) - shipped exposure"
        continue-on-error: true
        run: npm audit --omit=dev
